name: smartcook
description: "A new Flutter project."

publish_to: 'none' 


version: 1.3.4+28

environment:
  sdk: ^3.5.0


dependencies:
  flutter:
    sdk: flutter
  # Material/Cupertino/Widgets strings (back button tooltip, text selection
  # menu, date pickers...) for Indonesian. Without it, forcing locale 'id'
  # throws "No MaterialLocalizations found" in every Material widget.
  flutter_localizations:
    sdk: flutter

 
  cupertino_icons: ^1.0.8
  google_sign_in: ^6.2.2
  firebase_core: ^3.11.0
  firebase_auth: ^5.5.0
  smooth_page_indicator: ^2.0.1
  http: ^1.2.0
  shared_preferences: ^2.2.2
  url_launcher: any
  flutter_markdown: ^0.7.4+1
  dio: ^5.7.0
  cached_network_image: ^3.4.1
  cryptography: ^2.7.0
  package_info_plus: ^8.0.2
  path_provider: ^2.1.4
  open_filex: ^4.5.0
  crypto: ^3.0.6
  flutter_secure_storage: ^9.2.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.11.0
  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true

  assets:
    - image/
